apiVersion: apps/v1
kind: Deployment
metadata:
  name: x07-container-escape
  labels:
    app.kubernetes.io/name: x07-container-escape
    challenge: x07
spec:
  replicas: 1
  selector:
    matchLabels:
      app: x07-container-escape
  template:
    metadata:
      labels:
        app: x07-container-escape
        challenge: x07
    spec:
      automountServiceAccountToken: false
      containers:
      - name: x07-container-escape
        image: ctf-registry.internal/challenges/x07-container-escape:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: ssh
          containerPort: 22
        resources:
          requests:
            cpu: "500m"
            memory: 512Mi
          limits:
            cpu: "4000m"
            memory: 4096Mi
