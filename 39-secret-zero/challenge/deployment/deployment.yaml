apiVersion: apps/v1
kind: Deployment
metadata:
  name: x09-secret-zero
  labels:
    app: x09-secret-zero
    challenge: secret-zero
    category: machine-identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: x09-secret-zero
  template:
    metadata:
      labels:
        app: x09-secret-zero
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: challenge
          image: latveria-secret-zero:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: PORT
              value: "80"
            - name: FLAG
              valueFrom:
                secretKeyRef:
                  name: x09-flag-secret
                  key: flag
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
