apiVersion: v1
kind: ResourceQuota
metadata:
  name: x09-secret-zero-quota
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "256Mi"
    limits.cpu: "1000m"
    limits.memory: "512Mi"
    pods: "3"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: x09-secret-zero-limits
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      type: Container
