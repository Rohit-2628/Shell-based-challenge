apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: x09-secret-zero-netpol
spec:
  podSelector:
    matchLabels:
      app: x09-secret-zero
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow inbound HTTP from platform gateway / ingress controller only
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: platform-gateway
      ports:
        - protocol: TCP
          port: 80
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Local loopback / cluster-internal communication only; cloud metadata & external internet blocked
