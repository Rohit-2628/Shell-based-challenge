apiVersion: v1
kind: ResourceQuota
metadata:
  name: d28-resource-quota
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "256Mi"
    limits.cpu: "1000m"
    limits.memory: "384Mi"
    pods: "3"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: d28-limit-range
spec:
  limits:
    - default:
        cpu: "1000m"
        memory: "384Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      type: Container
