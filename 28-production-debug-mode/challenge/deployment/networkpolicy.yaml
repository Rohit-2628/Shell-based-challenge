apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: d28-network-isolation
  labels:
    app.kubernetes.io/managed-by: ctf-platform
spec:
  podSelector:
    matchLabels:
      app: d28-production-debug
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress strictly to designated HTTP gateway port (TCP/80)
    - ports:
        - protocol: TCP
          port: 80
  egress:
    # Allow kube-dns queries only (default-deny all other external/metadata traffic)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
