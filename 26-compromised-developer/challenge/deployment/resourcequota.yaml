apiVersion: v1
kind: ResourceQuota
metadata:
  name: d26-resource-quota
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "512Mi"
    limits.cpu: "2000m"
    limits.memory: "1Gi"
    pods: "3"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: d26-limit-range
spec:
  limits:
    - default:
        cpu: "1000m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      type: Container
