apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: d26-network-isolation
  labels:
    app.kubernetes.io/managed-by: ctf-platform
spec:
  podSelector:
    matchLabels:
      app: d26-compromised-developer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress strictly to designated SSH gateway port
    - ports:
        - protocol: TCP
          port: 22
  egress:
    # Allow kube-dns queries only
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
