version: "3.8"

services:
  26-compromised-developer:
    build:
      context: .
      dockerfile: Dockerfile
    image: 26-compromised-developer:latest
    container_name: 26-compromised-developer
    ports:
      - "2227:22"
    environment:
      - FLAG=${FLAG:-YUVA{c0mpr0m1s3d_d3v_h1st0ry_hm4c_auth_8821}}
