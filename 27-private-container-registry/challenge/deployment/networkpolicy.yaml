apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: d27-private-container-registry-netpol
  namespace: team-sandbox
  labels:
    app.kubernetes.io/name: d27-private-container-registry
    challenge: d27
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: d27-private-container-registry
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow platform gateway ingress on TCP/80 and TCP/22
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 22
  egress:
    # Allow internal DNS resolution only
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
