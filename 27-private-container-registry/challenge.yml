name: 27-private-container-registry
category: web
difficulty: Very Hard
description: |
  Private Container Registry. Query the OCI Registry v2 API on port 8081, discover historical image tags for latveria/orbital-sentinel:v1.0.0, download and extract image layer blobs to recover deleted vault credentials, and authenticate against the vault API to capture the flag.
docker:
  internal_ports: [80]
connection_info: 'http://<host>:8081/'
connection:
  protocol: http
  port: 8081
credentials:
  username: anonymous
  password: 
flag: YUVA{pr1v4t3_r3g1stry_l4y3r_3xf1ltr4t10n_9901}
tags:
  - docker-registry
  - oci-v2
  - image-layers
  - secret-extraction
  - vault-api
hints:
  - "The registry implements the standard OCI / Docker Registry v2 API. Query 'http://<host>:8081/v2/_catalog' to list available repositories, and then check 'http://<host>:8081/v2/latveria/orbital-sentinel/tags/list' to enumerate available image versions."
  - "Inspect the manifest for historical tags like 'v1.0.0' via '/v2/latveria/orbital-sentinel/manifests/v1.0.0'. Download the layer blobs from '/v2/latveria/orbital-sentinel/blobs/<digest>' and unpack them with tar/gzip to find the un-sanitized config '/app/config/orbital_vault.conf'."
  - "Use the recovered 'LATVERIAN_INTERNAL_TOKEN' from the v1.0.0 config to send an authenticated HTTP POST request to 'http://<host>:8081/api/v1/vault/override' with header 'X-Latverian-Token: <token>' to disengage the defense grid and obtain the flag."
