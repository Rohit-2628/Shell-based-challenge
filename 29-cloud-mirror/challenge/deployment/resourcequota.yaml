apiVersion: v1
kind: ResourceQuota
metadata:
  name: d29-team-quota
  namespace: team-sandbox
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "512Mi"
    limits.cpu: "1000m"
    limits.memory: "768Mi"
    pods: "3"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: d29-limit-range
  namespace: team-sandbox
spec:
  limits:
    - default:
        cpu: "1000m"
        memory: "768Mi"
      defaultRequest:
        cpu: "250m"
        memory: "256Mi"
      type: Container
