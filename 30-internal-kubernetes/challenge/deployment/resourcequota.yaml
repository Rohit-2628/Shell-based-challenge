apiVersion: v1
kind: ResourceQuota
metadata:
  name: d30-quota
  namespace: challenge-d30
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 1Gi
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: d30-limits
  namespace: challenge-d30
spec:
  limits:
  - default:
      cpu: 500m
      memory: 384Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    type: Container
