apiVersion: v1
kind: ResourceQuota
metadata:
  name: x05-the-black-mirror-quota
  labels:
    app.kubernetes.io/name: x05-the-black-mirror
    challenge: x05
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "512Mi"
    limits.cpu: "2"
    limits.memory: "1Gi"
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: x05-the-black-mirror-limits
  labels:
    app.kubernetes.io/name: x05-the-black-mirror
    challenge: x05
spec:
  limits:
  - default:
      cpu: "500m"
      memory: "256Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    type: Container
