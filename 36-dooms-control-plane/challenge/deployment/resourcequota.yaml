apiVersion: v1
kind: ResourceQuota
metadata:
  name: x06-dooms-control-plane-quota
  labels:
    challenge: x06
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: x06-dooms-control-plane-limits
  labels:
    challenge: x06
spec:
  limits:
  - default:
      cpu: 500m
      memory: 256Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    type: Container
